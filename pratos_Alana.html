<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolhas de Pratos</title>
</head>

<body>

    <script>
       
            let prato = prompt("Digite:");

            switch (prato) {
                case "Pizza":
                    document.write("Vou querer uma Pizza");
                    break;
                case "Hambúrguer":
                    document.write("Vou querer um Hambúrguer");
                    break;
                case "Sushi":
                    document.write("Vou querer um Sushi");
                    break;
                case "Salada":
                    document.write("Vou querer uma Salada");
                    break;
                default:
                    document.write("Opção Inválida!!!");
            }

    


    </script>
</body>

</html>
